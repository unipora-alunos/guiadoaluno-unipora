<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Desafio do Guia</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#eaf4ff;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;
    overflow:hidden;
  }
  .game-card {
    width:min(760px, 100%);
    background:#fff;
    border:2px solid #d7e7f8;
    border-radius:22px;
    box-shadow:0 12px 35px rgba(16,42,67,.12);
    padding:18px;
  }
  .topbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    color:#17177a;
  }
  .title {
    font-weight:800;
    font-size:18px;
  }
  .controls {
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .hint {
    font-size:12px;
    color:#52657a;
    background:#f2f7fc;
    border-radius:10px;
    padding:7px 10px;
  }
  .score {
    font-weight:900;
    font-size:18px;
    letter-spacing:1px;
    white-space:nowrap;
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    background:#fff;
    border:2px solid #dbe9f6;
    border-radius:16px;
    touch-action:none;
  }
  .mobile-controls {
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:12px;
  }
  .mobile-controls button, .restart {
    border:0;
    background:#17177a;
    color:#fff;
    font-weight:800;
    border-radius:12px;
    padding:10px 18px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(23,23,122,.18);
  }
  .mobile-controls button:active, .restart:active { transform:translateY(1px); }
  .footer {
    text-align:center;
    color:#6b7f93;
    font-size:11px;
    margin-top:9px;
  }
  @media (min-width:650px) {
    .mobile-controls { display:none; }
  }
</style>
</head>
<body>
<div class="game-card">
  <div class="topbar">
    <div class="title">🎓 Desafio do Guia</div>
    <div class="controls">
      <div class="hint">↑ / Espaço: pular</div>
      <div class="hint">↓: abaixar</div>
      <div class="score" id="score">🎓 000000</div>
    </div>
  </div>

  <canvas id="gameCanvas" width="720" height="360"></canvas>

  <div class="mobile-controls">
    <button id="jumpBtn">↑ Pular</button>
    <button id="duckBtn">↓ Abaixar</button>
  </div>

  <div class="footer">Supere os obstáculos. Cada obstáculo vale 5 pontos.</div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

const groundY = 285;
const gravity = 0.62;
const jumpForce = -12.2;
const maxScore = 999999;

let score = 0;
let gameOver = false;
let started = false;
let obstacles = [];
let spawnTimer = 0;
let nextSpawn = 90;
let speed = 4.2;
let ducking = false;
let lastTime = 0;

const player = {
  x: 75,
  y: groundY - 42,
  w: 38,
  h: 42,
  vy: 0,
  grounded: true
};

function resetGame() {
  score = 0;
  gameOver = false;
  started = false;
  obstacles = [];
  spawnTimer = 0;
  nextSpawn = 90;
  speed = 4.2;
  ducking = false;
  player.y = groundY - player.h;
  player.vy = 0;
  player.grounded = true;
  updateScore();
}

function updateScore() {
  scoreEl.textContent = "🎓 " + String(score).padStart(6, "0");
}

function jump() {
  if (gameOver) {
    resetGame();
    return;
  }
  started = true;
  if (player.grounded && !ducking) {
    player.vy = jumpForce;
    player.grounded = false;
  }
}

function setDuck(value) {
  if (!gameOver) {
    started = true;
    ducking = value && player.grounded;
  }
}

function spawnObstacle() {
  const airborne = Math.random() < 0.20;

  if (airborne) {
    obstacles.push({
      x: canvas.width + 20,
      y: groundY - 75,
      w: 46,
      h: 18,
      type: "air",
      counted: false
    });
  } else {
    const h = 25 + Math.random() * 28;
    obstacles.push({
      x: canvas.width + 20,
      y: groundY - h,
      w: 24 + Math.random() * 10,
      h,
      type: "ground",
      counted: false
    });
  }
}

function rectsOverlap(a,b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

function getPlayerHitbox() {
  if (ducking) {
    return {
      x: player.x + 3,
      y: player.y + 17,
      w: player.w + 10,
      h: 25
    };
  }
  return {
    x: player.x + 4,
    y: player.y + 3,
    w: player.w - 8,
    h: player.h - 5
  };
}

function update(dt) {
  if (gameOver || !started) return;

  // A velocidade cresce gradualmente, com limite para continuar jogável.
  speed = Math.min(11.5, 4.2 + score * 0.006);

  if (!ducking || !player.grounded) {
    player.vy += gravity * dt;
    player.y += player.vy * dt;
  }

  if (player.y >= groundY - player.h) {
    player.y = groundY - player.h;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  spawnTimer += dt;
  if (spawnTimer >= nextSpawn) {
    spawnObstacle();
    spawnTimer = 0;
    nextSpawn = Math.max(48, 92 - speed * 2 + Math.random() * 35);
  }

  const hitbox = getPlayerHitbox();

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.x -= speed * dt;

    if (rectsOverlap(hitbox, obs)) {
      gameOver = true;
      ducking = false;
    }

    if (!obs.counted && obs.x + obs.w < player.x) {
      obs.counted = true;
      score = Math.min(maxScore, score + 5);
      updateScore();
    }

    if (obs.x + obs.w < -30) {
      obstacles.splice(i, 1);
    }
  }
}

function drawPlayer() {
  const x = player.x;
  const y = ducking ? player.y + 15 : player.y;
  const w = ducking ? 52 : player.w;
  const h = ducking ? 27 : player.h;

  // Corpo
  ctx.fillStyle = "#17177a";
  ctx.fillRect(x + 5, y + 10, w - 10, h - 10);

  // Cabeça
  ctx.fillRect(x + 8, y, 24, 24);

  // Olho
  ctx.fillStyle = "#fff";
  ctx.fillRect(x + 25, y + 6, 4, 4);

  // Livro
  ctx.fillStyle = "#fff";
  ctx.fillRect(x + w - 2, y + 18, 15, 10);
  ctx.strokeStyle = "#17177a";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + w - 2, y + 18, 15, 10);

  // Braço
  ctx.fillStyle = "#17177a";
  ctx.fillRect(x + w - 7, y + 16, 10, 5);
}

function drawObstacle(obs) {
  ctx.fillStyle = "#17177a";

  if (obs.type === "ground") {
    // Pilha/livro estilizado
    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
    ctx.fillStyle = "#fff";
    ctx.fillRect(obs.x + 4, obs.y + 7, obs.w - 8, 2);
    ctx.fillRect(obs.x + 4, obs.y + 14, obs.w - 8, 2);
  } else {
    // Obstáculo aéreo
    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
    ctx.fillStyle = "#fff";
    ctx.fillRect(obs.x + 7, obs.y + 7, obs.w - 14, 2);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Céu
  ctx.fillStyle = "#fafdff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Detalhes discretos
  ctx.fillStyle = "#e8f2fb";
  ctx.fillRect(35, 55, 80, 3);
  ctx.fillRect(canvas.width - 130, 85, 95, 3);

  // Chão
  ctx.fillStyle = "#17177a";
  ctx.fillRect(0, groundY, canvas.width, 3);

  // Pequenos traços de movimento
  ctx.fillStyle = "#cbdff1";
  for (let i = 0; i < 7; i++) {
    const xx = (i * 137 - (performance.now() * speed / 35) % 137);
    ctx.fillRect(xx, groundY + 18 + (i % 3) * 8, 30, 2);
  }

  obstacles.forEach(drawObstacle);
  drawPlayer();

  if (!started && !gameOver) {
    ctx.fillStyle = "#17177a";
    ctx.font = "bold 21px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Toque, ↑ ou Espaço para começar", canvas.width / 2, 75);
    ctx.font = "14px Arial";
    ctx.fillStyle = "#5f7388";
    ctx.fillText("Pule os obstáculos e tente bater seu próprio recorde.", canvas.width / 2, 101);
  }

  if (gameOver) {
    ctx.fillStyle = "rgba(255,255,255,.88)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#17177a";
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.fillText("FIM DE JOGO", canvas.width / 2, 135);

    ctx.font = "bold 20px Arial";
    ctx.fillText("🎓 " + String(score).padStart(6, "0"), canvas.width / 2, 175);

    ctx.font = "15px Arial";
    ctx.fillStyle = "#5f7388";
    ctx.fillText("Toque na tela, ↑ ou Espaço para jogar novamente", canvas.width / 2, 215);
  }
}

function loop(timestamp) {
  const dt = Math.min(1.5, (timestamp - lastTime) / 16.67 || 1);
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  jump();
});

window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
  if (e.code === "ArrowDown") {
    e.preventDefault();
    setDuck(true);
  }
});

window.addEventListener("keyup", (e) => {
  if (e.code === "ArrowDown") {
    e.preventDefault();
    setDuck(false);
  }
});

document.getElementById("jumpBtn").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  jump();
});

document.getElementById("duckBtn").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  setDuck(true);
});
document.getElementById("duckBtn").addEventListener("pointerup", () => setDuck(false));
document.getElementById("duckBtn").addEventListener("pointercancel", () => setDuck(false));
document.getElementById("duckBtn").addEventListener("pointerleave", () => setDuck(false));

resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
